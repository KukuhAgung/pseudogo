<section class="absolute inset-0 flex w-full h-full overflow-hidden items-stretch bg-bg-0">
  <aside
    class="hidden md:block w-80 pl-8 shrink-0 h-full border-r border-line bg-bg-0 overflow-y-auto"
  >
    <app-docs-sidebar></app-docs-sidebar>
  </aside>

  <aside
    class="md:hidden fixed top-0 right-0 h-full w-100 max-w-full bg-bg-0 border-l border-line shadow-2xl flex flex-col transition-transform duration-300 z-50 translate-x-full"
    [class.translate-x-0]="ui.sidebarDocsOpen()"
    [class.translate-x-full]="!ui.sidebarDocsOpen()"
  >
    <app-docs-sidebar></app-docs-sidebar>
  </aside>

  <main #scrollContainer class="flex-1 h-full overflow-y-auto bg-bg-0">
    <div
      class="mx-auto w-full max-w-7xl px-5 pt-6 pb-20 mob:px-8 mob:pt-10 mob:pb-24 lg:px-12 flex items-start relative"
    >
      <div class="flex-1 min-w-0 pr-0 xl:pr-12">
        <router-outlet></router-outlet>
      </div>

      <aside class="hidden xl:block w-56 shrink-0 self-stretch relative">
        <div class="sticky top-5">
          <h4 class="text-xs font-semibold text-strong uppercase tracking-wider mb-4">
            On this page
          </h4>

          <ul class="flex flex-col gap-2.5 text-[13px]">
            @for (section of sections(); track section.id) {
              <li>
                <a
                  [href]="'#' + section.id"
                  (click)="scrollTo(section.id, $event)"
                  class="block transition-all duration-200 border-l-2 pl-3 py-0.5"
                  [class]="
                    activeSection() === section.id
                      ? 'border-primary text-primary font-medium'
                      : 'border-transparent text-sub hover:border-line hover:text-strong'
                  "
                  [class.ml-3]="section.level === 'h3'"
                >
                  {{ section.title }}
                </a>
              </li>
            }
          </ul>
        </div>
      </aside>
    </div>
  </main>
</section>

@if (ui.sidebarDocsOpen()) {
  <div
    class="md:hidden fixed inset-0 bg-black/50 z-40 animate-fade-in"
    (click)="ui.toggleSidebarDocs()"
  ></div>
}
